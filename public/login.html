<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Side Job Tracker — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --accent: #2a8a5f; --bg: #f7f5f1; --card: #ffffff; --text: #2b2b2b; --border: #e2ddd3; }
  [data-theme="dark"] {
    --accent: #4a90e2; --bg: #121212; --card: #1c1c1c; --text: #f0f0f0; --border: #333333;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
    width: 320px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    position: relative;
  }
  #themeToggle {
    position: absolute; top: 14px; right: 14px;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 8px; font-size: 13px; cursor: pointer; color: var(--text);
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #777; font-size: 13px; margin: 0 0 24px; }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 14px;
    background: var(--card);
    color: var(--text);
  }
  button[type="submit"] {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button[type="submit"]:hover { opacity: 0.9; }
  #error { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <button id="themeToggle" title="Toggle light/dark mode">🌙</button>
    <h1>🧾 Side Job Tracker</h1>
    <p class="sub">Income, expenses, mileage & tax estimate</p>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Password" autofocus required>
      <button type="submit">Log In</button>
      <div id="error">Incorrect password.</div>
    </form>
  </div>

<script>
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(localStorage.getItem('rover-theme') || 'light');
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('rover-theme', next);
  applyTheme(next);
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  if (res.ok) {
    window.location.href = '/';
  } else {
    document.getElementById('error').style.display = 'block';
  }
});
</script>
</body>
</html>
